aid: afuninteractive
name: AFUN Interactive
description: >-
  AFUN Interactive (에이펀인터렉티브) is a Seoul-based real-time 3D content production studio founded in
  2017 that builds digital humans, virtual celebrities and high-quality real-time 3D media. Its four
  stated service lines are Digital Celebrity Management, Digital Human (photoreal CG characters and
  live avatars for hologram, VR, AR and AI concierge use), Ganimation (a real-time animation/game
  hybrid genre that won at the 2018 Venice International Film Festival), and High Quality Realtime
  3D Contents (AR content, car configurators and high-end MR for automotive, entertainment and
  telecom clients). Through its subsidiary VV Entertainment it produces and manages the virtual
  K-pop artist APOKI. It is a work-for-hire production and artist-management business that sells
  finished 3D content, not developer access, and publishes no public API, SDK, developer portal or
  machine-readable specification.
